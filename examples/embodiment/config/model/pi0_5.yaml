model_type: "openpi"

# Default Pi0.5 shape. Env-specific fields (config_name, action_dim,
# num_action_chunks, task, …) are overridden in the experiment YAML.
precision: null
pi05: True

is_lora: False
lora_rank: 32

num_action_chunks: 10
action_dim: 7
use_proprio: True
num_steps: 5
add_value_head: False

openpi:
  # Factory selector: sft | eval | rl | dagger | dsrl. Embodiment default is rl;
  # eval / sft / dagger / dsrl experiments override this in the main YAML.
  task: rl
  config_name: "pi05_libero"
  num_images_in_input: 2
  noise_level: 0.5
  action_chunk: ${..num_action_chunks}
  num_steps: ${..num_steps}
  train_expert_only: True
  enable_fused_prefix: False
  action_env_dim: ${..action_dim}
  noise_method: "flow_sde"
  add_value_head: ${..add_value_head}
  value_after_vlm: False
  value_vlm_mode: "mean_token"
  detach_critic_input: False
  model_action_dim: 32
  paligemma_variant: "gemma_2b"
  action_expert_variant: "gemma_300m"
  max_token_len: 200

  # DSRL specific configurations (disabled by default)
  use_dsrl: False
  dsrl_state_dim: 8
  dsrl_action_noise_dim: 32
  dsrl_num_q_heads: 10
  dsrl_agg_q: "mean"
  dsrl_image_latent_dim: 64
  dsrl_state_latent_dim: 64
  dsrl_hidden_dims: [128, 128, 128]
  # Fused RoPE / GELU kernels. Isaac Sim jobs set this false: their bundled
  # torch cannot compile against the venv Triton.
  torch_compile: True
