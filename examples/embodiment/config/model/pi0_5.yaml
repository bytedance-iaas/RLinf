model_type: "openpi"

# Default Pi0.5 shape. Env-specific fields (config_name, action_dim,
# num_action_chunks, task, …) are overridden in the experiment YAML.
precision: null
pi05: True

is_lora: False
lora_rank: 32

num_action_chunks: 10
action_dim: 7
use_proprio: True
num_steps: 5
add_value_head: False

openpi:
  # Factory selector: sft | eval | rl | dagger | dsrl. Embodiment default is rl;
  # eval / sft / dagger / dsrl experiments override this in the main YAML.
  task: rl
  config_name: "pi05_libero"
  num_images_in_input: 2
  noise_level: 0.5
  action_chunk: ${..num_action_chunks}
  num_steps: ${..num_steps}
  train_expert_only: True
  enable_fused_prefix: False
  action_env_dim: ${..action_dim}
  noise_method: "flow_sde"
  add_value_head: ${..add_value_head}
  value_after_vlm: False
  value_vlm_mode: "mean_token"
  detach_critic_input: False
  model_action_dim: 32
  paligemma_variant: "gemma_2b"
  action_expert_variant: "gemma_300m"
  max_token_len: 200

  # Fused RoPE / GELU kernels. Isaac Sim jobs set this false: their bundled
  # torch cannot compile against the venv Triton.
  torch_compile: True

  # CANN fused kernels for the Gemma stack. Ascend only, ignored elsewhere,
  # and each stays off until a workload has compared it against the portable
  # path. npu_fused_rms_norm covers the non-adaptive norms only; the action
  # expert's adaptive norms keep the explicit float32 affine.
  npu_fused_attention: False
  npu_fused_rms_norm: False
  # npu_fused_rope covers the rotation, not the cos/sin tables: positions come
  # from a cumulative sum over the validity mask, so the tables depend on the
  # padding. It therefore helps the long prefix and not the short suffix.
  npu_fused_rope: False

  # Skip the vision encoder for an IMAGE_KEYS slot a task does not fill. Needs
  # a frozen encoder, and is platform-independent rather than Ascend-only.
  skip_masked_images: False
