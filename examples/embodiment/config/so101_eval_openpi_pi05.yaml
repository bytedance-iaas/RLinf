# Standalone evaluation of an SO101 PI0.5 checkpoint on the ManiSkill
# pick-and-place task. Mirrors so101_ppo_openpi_pi05.yaml but runs eval only.
defaults:
  - env/maniskill_so101_pick_place@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "so101_eval_openpi_pi05"
    logger_backends: ["tensorboard"]
  max_epochs: 1
  max_steps: -1
  only_eval: True
  val_check_interval: 1
  save_interval: 1000
  resume_dir: null
  ckpt_path: null

algorithm:
  group_size: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  normalize_advantages: True
  kl_penalty: kl
  reward_coef: 1.0
  update_epoch: 1
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  eval:
    rollout_epoch: 1
    total_num_envs: 128
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 640
    max_steps_per_rollout_epoch: 640
    use_fixed_reset_state_ids: True
    group_size: ${algorithm.group_size}
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: so101
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: "/path/to/model/so101_sft_openpi_pi05"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 2048
  seed: 42
  enable_offload: False
  model:
    model_path: "/path/to/model/so101_sft_openpi_pi05"
    model_type: "openpi"
    num_action_chunks: 10  # == the SFT action_horizon; ~11 pts over 5
    num_steps: 4
    add_value_head: True
    action_dim: 6
    policy_setup: "so100"
    openpi:
      value_after_vlm: True
      config_name: "pi05_so101"
      num_images_in_input: 2
      noise_method: "flow_noise"
      action_horizon: 10
      noise_logvar_range: [0.02, 0.04]
      noise_params: [0.16, 0.12, 200]  # unused while noise_method is flow_noise
      joint_logprob: True
    openpi_data:
      norm_stats_path: "/path/to/assets/so101/norm_stats.json"
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
