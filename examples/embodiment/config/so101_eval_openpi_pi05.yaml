defaults:
  - env/maniskill_so101_pick_place@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all   # eval only needs env + rollout (no actor training)

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "so101_eval_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1
  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    total_num_envs: 16
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 640
    max_steps_per_rollout_epoch: 640
    use_fixed_reset_state_ids: True
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: so101
  enable_offload: False
  pipeline_stage_num: 1

  # Full policy spec lives under rollout.model for eval (no actor.model in eval).
  model:
    model_path: "/data08/henryg/pai/results/so101_sft_openpi_pi05/checkpoints/global_step_8000"
    model_type: "openpi"
    add_value_head: False
    num_action_chunks: 5
    action_dim: 6
    num_steps: 4
    openpi:
      config_name: "pi05_so101"
      num_images_in_input: 2
      action_horizon: 10
      noise_method: "flow_noise"
    openpi_data:
      norm_stats_path: "/data08/henryg/pai/RLinf/assets/pi05_so101/henry-guo/so101-pick-place-v2/norm_stats.json"
    policy_setup: so100
