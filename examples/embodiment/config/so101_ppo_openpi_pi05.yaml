defaults:
  - env/maniskill_so101_pick_place@env.train
  - env/maniskill_so101_pick_place@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all   # colocate on all 8 H200 GPUs

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "so101_ppo_openpi_pi05"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1
  only_eval: False
  val_check_interval: 10
  save_interval: 50

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 5

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"

  bootstrap_type: always
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: "EnvGroup"

  # Override the default values in env/train or env/eval
  train:
    rollout_epoch: 1
    total_num_envs: 320
    auto_reset: True
    use_fixed_reset_state_ids: False
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
  eval:
    rollout_epoch: 1
    total_num_envs: 320
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    use_fixed_reset_state_ids: True
    group_size: ${algorithm.group_size}
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: so101
  enable_offload: False
  pipeline_stage_num: 1

  model:
    # SFT checkpoint produced by so101_sft_openpi_pi05 (native RLinf SFT).
    model_path: "/data08/henryg/pai/results/so101_sft_openpi_pi05/checkpoints/global_step_8000"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 5120
  seed: 0
  enable_offload: False

  # Override the default values in model/pi0_5
  model:
    model_path: "/data08/henryg/pai/results/so101_sft_openpi_pi05/checkpoints/global_step_8000"
    model_type: "openpi"
    add_value_head: True
    num_action_chunks: 5   # how many chunk actions the env executes per policy call
    action_dim: 6          # SO101: 5 arm joints + gripper
    num_steps: 4
    # openpi specific parameters
    openpi:
      value_after_vlm: True
      config_name: "pi05_so101"
      num_images_in_input: 2   # front (3rd_view_camera) + wrist camera
      noise_method: "flow_noise"
      action_horizon: 10   # must match the SFT num_action_chunks (H)
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True # False for flow_sde, True for flow_noise
    # Action/state normalization (same stats used for SFT).
    openpi_data:
      norm_stats_path: "/data08/henryg/pai/RLinf/assets/pi05_so101/henry-guo/so101-pick-place-v2/norm_stats.json"
    policy_setup: so100      # triggers joint-action passthrough in action_utils

  optim:
    lr: 7.91e-6
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    critic_warmup_steps: 0

  # Override the default values in hybrid_engines/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
