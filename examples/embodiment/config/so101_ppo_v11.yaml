# v11 = the FIRST reference-aligned PPO run of this project.
# Start: v10_step_1000 (ring-1 honest 55.1%, in-box 75.0%, full board 10.2%).
# Region: RING 1 -- set by SO101_SPAWN_FRAC in the launcher, so train and eval
#         share the region where the start policy actually has competence
#         (§F.0: PPO amplifies existing success, it does not discover it).
# Everything algorithmic is the πRL official recipe, unchanged from
# so101_ppo_v6_official.yaml; only the warm start and the dataconfig name move.
# FINAL RUN — πRL official recipe (libero_spatial_ppo_openpi_pi05.yaml values),
# applied verbatim. Only task-structural adaptations, each marked [TASK]:
#   [TASK] episode budget 640 (30Hz true task; official 240 was for LIBERO)
#   [TASK] ignore_terminations=True (hold-style success; §1 termination arithmetic)
#   [TASK] flow_noise + noise_params/num_steps per the maniskill OFFICIAL variant
#          (our infra is flow_noise; LIBERO variant uses flow_sde)
#   [TASK] rollout arithmetic translated to preserve the official INVARIANT
#          24,576 fresh samples / iteration = 12 minibatches of 2048:
#          64 envs x (640/5=128 chunks) x rollout_epoch 3 = 24,576
defaults:
  - env/maniskill_so101_pick_place@env.train
  - env/maniskill_so101_pick_place@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "so101_ppo_v11"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: False
  val_check_interval: 10   # [OPS] direction rule: eval cadence ~70min
  save_interval: 10        # [OPS] harvest law (official 40 assumed faster iters)
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 3         # [TASK] 64 envs x 128 chunks x 3 = 24,576 samples/iter
    total_num_envs: 64       # official
    auto_reset: True
    ignore_terminations: True  # [TASK]
    use_fixed_reset_state_ids: False
    max_episode_steps: 640
    max_steps_per_rollout_epoch: 640
  eval:
    rollout_epoch: 1
    total_num_envs: 128
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 640
    max_steps_per_rollout_epoch: 640
    use_fixed_reset_state_ids: True
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: so101
  enable_offload: False     # official (the True I tried was chasing a misdiagnosis)
  pipeline_stage_num: 1
  model:
    model_path: "/data08/henryg/pai/results/so101_sft_v10/so101_sft_openpi_pi05/checkpoints/global_step_1000"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32      # [MEM] official 128 was tuned for 128x128 images;
                            # ours are 640x480 (~25x activations) -> OOM at 141/143GB.
                            # Pure gradient-accumulation granularity: global_batch 2048
                            # unchanged, loss scaled by 1/grad_accum, no BatchNorm -> math identical.
  global_batch_size: 2048   # official
  seed: 42                  # official
  enable_offload: False
  model:
    model_path: "/data08/henryg/pai/results/so101_sft_v10/so101_sft_openpi_pi05/checkpoints/global_step_1000"
    model_type: "openpi"
    num_action_chunks: 5
    num_steps: 4             # [TASK] flow_noise pairing (maniskill official)
    add_value_head: True
    action_dim: 6
    policy_setup: "so100"
    openpi:
      value_after_vlm: True
      config_name: "pi05_so101_v10"
      num_images_in_input: 2
      noise_method: "flow_noise"
      action_horizon: 10
      noise_params: [0.16, 0.12, 200]   # maniskill official (NOT halved)
      joint_logprob: True
    openpi_data:
      norm_stats_path: "/data08/henryg/pai/RLinf/assets/pi05_so101_v4/so101-sim-demos-v4/norm_stats.json"

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"     # official
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
