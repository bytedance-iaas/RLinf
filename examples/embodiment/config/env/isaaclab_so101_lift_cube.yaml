env_type: isaaclab
total_num_envs: null
auto_reset: False
ignore_terminations: False
use_rel_reward: True
seed: 0
group_size: 1

reward_coef: 1.0
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 256
max_episode_steps: 256 # max episode steps for truncation


video_cfg:
  save_video: False
  info_on_video: True
  fps: 20
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  id: "LeIsaac-SO101-LiftCube-Rewarded-v0"
  num_envs: null
  max_episode_steps: ${..max_episode_steps} # max episode steps for truncation
  # Must match LiftCubeEnvCfg.task_description verbatim, so the prompt at RL time
  # is the one the checkpoint was fine-tuned with.
  task_description: "Lift the red cube up."
  # LeIsaac names its sensors after the mount point. LiftCube deletes the wrist
  # camera in __post_init__, so only `front` exists here -- adding a `wrist` block
  # would raise in IsaaclabSO101Env._make_env_function.
  front:
    height: 256
    width: 256
