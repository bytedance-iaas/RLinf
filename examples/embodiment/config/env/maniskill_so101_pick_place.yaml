env_type: maniskill

total_num_envs: null

# Default wrap mode: ManiskillEnv._wrap_obs reads sensor_data["3rd_view_camera"]
# as main_images and sensor_data["wrist_camera"] as wrist_images, plus
# agent.robot.get_qpos() (6-dim SO101 joints) as states and
# get_language_instruction() as task_descriptions.
wrap_obs_mode: default
# SO101 LeRobot dataset records joints in LeRobot NORMALIZED units (arm
# [-100,100], gripper [0,100]); convert ManiSkill's radian qpos to those units
# (via the follower calibration in so101_calib.py) so the proprioceptive state
# matches the policy's stats. Actions are converted normalized->radians in
# action_utils.prepare_actions_for_maniskill.
so101_state_norm: True
use_full_state: False
auto_reset: False
ignore_terminations: False
use_rel_reward: False
reward_mode: raw
seed: 0
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 320
max_episode_steps: 640 # 30Hz: demo median ~440 * 1.45; %5==0; 128envs*128chunks=16384=8*2048

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

enable_offload: False

init_params:
  id: "SO101GrabRedCube-v1"
  num_envs: null # will be set in ManiSkillEnv init
  obs_mode: "rgb"
  reward_mode: "normalized_dense"
  # Absolute joint-position control: the 6-dim PI0.5 output maps straight onto
  # [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper].
  control_mode: "pd_joint_pos"
  sim_backend: "gpu"
  sim_config:
    sim_freq: 120
    control_freq: 30  # = real dataset fps (measured); sim_freq 120 -> 4 substeps
  max_episode_steps: ${..max_episode_steps} # max episode steps for truncation
  sensor_configs:
    shader_pack: "default"
  render_mode: rgb_array
