env_type: maniskill

total_num_envs: null

# ManiskillEnv._wrap_obs reads sensor_data["3rd_view_camera"] as main_images and
# sensor_data["wrist_camera"] as wrist_images, plus agent.robot.get_qpos()
# (6-dim SO101 joints) as states and get_language_instruction() as
# task_descriptions.
wrap_obs_mode: default
# The SO101 LeRobot dataset records joints in LeRobot NORMALIZED units (arm
# [-100,100], gripper [0,100]); convert ManiSkill's radian qpos into those units
# (via the follower calibration in so101_calib.py) so the proprioceptive state
# matches the policy's normalization stats. Actions are converted in the
# opposite direction in action_utils.prepare_actions_for_maniskill.
so101_state_norm: True
use_full_state: False
auto_reset: False
ignore_terminations: False
use_rel_reward: False
reward_mode: raw
seed: 0
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 320
# 30 Hz: real demo median ~440 steps * 1.45 margin; divisible by 5 (chunk size).
max_episode_steps: 640

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

enable_offload: False

init_params:
  id: "SO101GrabRedCube-v1"
  num_envs: null # will be set in ManiSkillEnv init
  obs_mode: "rgb"
  reward_mode: "normalized_dense"
  # Absolute joint-position control: the 6-dim PI0.5 output maps straight onto
  # [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper].
  control_mode: "pd_joint_pos"
  sim_backend: "gpu"
  # Cube spawn coverage. "full_board" matches the measured real episodes (all 87
  # first frames span the full board); "legacy" is the older 6x8 cm sub-box, kept
  # only for comparison with historical runs.
  spawn_mode: "full_board"
  # (x0, x1, y0, y1) fractions of the active spawn range, to target a sub-region
  # for weak-region data collection. null = full range.
  spawn_frac: null
  sim_config:
    sim_freq: 120
    control_freq: 30  # = real dataset fps (measured); sim_freq 120 -> 4 substeps
  max_episode_steps: ${..max_episode_steps} # max episode steps for truncation
  sensor_configs:
    shader_pack: "default"
  render_mode: rgb_array
