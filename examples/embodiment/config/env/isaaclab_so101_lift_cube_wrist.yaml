env_type: isaaclab
total_num_envs: null
auto_reset: False
ignore_terminations: False
use_rel_reward: True
seed: 0
group_size: 1

reward_coef: 1.0
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 250
max_episode_steps: 250 # max episode steps for truncation


video_cfg:
  save_video: False
  info_on_video: True
  fps: 20
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  # Two-camera variant of LeIsaac-SO101-LiftCube-Rewarded-v0. Registered by our
  # so101_rl extension package, which restores the wrist camera LeIsaac's LiftCube
  # deletes. Use this id for checkpoints SFT'd on front+wrist data; the plain
  # `-Rewarded-v0` id (see isaaclab_so101_lift_cube.yaml) stays single-camera.
  id: "LeIsaac-SO101-LiftCube-Rewarded-Wrist-v0"
  num_envs: null
  max_episode_steps: ${..max_episode_steps} # max episode steps for truncation
  # Must match the checkpoint's SFT prompt verbatim. The SFT dataset
  # (henry-guo/so101-pick-place-new) was labelled "Grab the red cube", which is not
  # LeIsaac's own LiftCube task_description ("Lift the red cube up.") -- the prompt
  # follows the checkpoint, not the task name.
  task_description: "Grab the red cube"
  # 480x640 on purpose, not 256x256. Two reasons, both about matching what the
  # policy saw during SFT:
  #   * `resize_with_pad` preserves aspect ratio. A 4:3 frame becomes 224x168
  #     content plus 28px black bars top and bottom; a square frame fills 224x224
  #     with no bars. The bars are part of the input distribution.
  #   * IsaacLab derives `vertical_aperture = horizontal_aperture * height / width`
  #     when it is not set, so resolution changes the vertical FOV: 4:3 gives
  #     v_aper 28.58, square gives 38.11.
  # It costs render throughput (5.6x the pixels of 256x256), which is the right
  # trade while the open question is whether the checkpoint transfers at all.
  front:
    height: 480
    width: 640
  wrist:
    height: 480
    width: 640
