defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1

runner:
  task_type: embodied
  logger:
    log_path: "../results/ascend_libero_spatial_grpo_openpi_pi05"
    project_name: rlinf
    experiment_name: "ci-test"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  # GRPO scores each rollout against the others started from the same state.
  # validate_embodied_cfg requires total_num_envs // env_ranks // stages to be a
  # multiple of this, so each env process has to hold whole groups.
  group_size: 8
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  # Zero as in the PPO config: a flow-matching policy reports no entropy, so the
  # bonus contributes neither a term nor a gradient.
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  # Off because the filter drops a group whose rewards all sit outside the
  # bounds, which over the 10 steps this test runs is every group.
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"

  # Override the default values in env/libero_spatial
  train:
    rollout_epoch: 1
    # Two env ranks x one whole group of 8. Over 10 steps no rollout reaches the
    # goal, so the group's rewards are equal and the advantages are zero; this
    # config checks that the path runs, not that it learns. A 240-step run of it
    # reaches success_once 0.69 with grad_norm 29.4 on two NPUs.
    total_num_envs: 16
    group_size: ${algorithm.group_size}
    max_episode_steps: 10
    max_steps_per_rollout_epoch: 10
    reward_coef: ${algorithm.reward_coef}
    # OSMesa renders on the CPU; render only the frame each action chunk uses.
    skip_intermediate_renders: True
  eval:
    rollout_epoch: 1 # set eval.rollout_epoch > 0 when enable runner.only_eval or runner.val_check_interval > 0
    total_num_envs: 8
    max_episode_steps: 10
    auto_reset: True
    ignore_terminations: True
    max_steps_per_rollout_epoch: 10
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    skip_intermediate_renders: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/workspace/dataset/RLinf-Pi05-LIBERO-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 16
  seed: 42
  enable_offload: False

  # Override the default values in model/pi0_5
  model:
    model_path: "/workspace/dataset/RLinf-Pi05-LIBERO-SFT"
    model_type: "openpi"

    num_action_chunks: 5 # interface for the env
    num_steps: 3
    # GRPO scores whole rollouts, so there is no critic and no value head.
    add_value_head: False

  optim:
    lr: 5.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    weight_decay: 0.01
    clip_grad: 1.0

  # Override the default values in hybrid_engines/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
