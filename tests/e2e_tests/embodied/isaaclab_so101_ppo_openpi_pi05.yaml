# F4.1: one-step PPO e2e for SO101 LiftCube --
# rollout -> reward -> advantage -> actor/value loss -> optimizer step -> ckpt save/load.
#
# This is a smoke-sized mirror of examples/embodiment/config/isaaclab_so101_ppo_openpi_pi05.yaml.
# Everything that defines the *chain* (algorithm block, model block, fsdp block,
# task id, camera count, chunk size) is copied verbatim from there; only the env
# scale and the batch sizes are shrunk, plus save_interval. Deviations from that
# file, and why:
#
#   * save_interval: 1 (vs 100). The Franka sibling isaaclab_ppo_openpi_pi05.yaml
#     uses -1, which disables saving entirely (is_save_enabled = save_interval > 0)
#     and therefore would not cover F4.1's "ckpt save/load" criterion at all.
#     With max_epochs=1 the runner calls check_progress(1, 1, -1, 1, 1.0) after
#     global_step becomes 1, so save_model=True and the checkpoint lands at
#     <log_path>/<experiment_name>/checkpoints/global_step_1/actor/.
#   * max_steps_per_rollout_epoch / max_episode_steps: 100 (vs 250). Must stay a
#     multiple of num_action_chunks=50 (asserted in rlinf/config.py); 100 gives
#     n_chunk_steps=2, i.e. GAE actually has a time axis to bootstrap over, which
#     50 (a single chunk step) would not.
#   * rollout_epoch: 1 (vs 2), total_num_envs: 4 (vs 64), micro/global batch 1/4
#     (vs 16/128). See the divisibility note below.
#   * update_epoch stays 3 and critic_warmup_steps stays 0, both as in the real
#     config: warmup > 0 would mask out the actor loss and F4.1 is exactly the
#     check that actor gradients flow.
#
# Batch-size divisibility -- three independent asserts in fsdp_actor_worker.py,
# with W = actor world size and rollout_size = n_chunk_steps x rollout_epoch x
# total_num_envs / W:
#   (1) global_batch_size % (micro_batch_size * W) == 0
#   (2) rollout_size % (global_batch_size // W) == 0
#   (3) train_global_batch_size % micro_batch_size == 0
# 4 / 4 / 1 satisfies all three for W in {1, 2, 4}, so this config does not have
# to be re-tuned if the run is placed on fewer cards than the box has.
#
# Launch (leg 1, fresh training + checkpoint save):
#
#   cd /workspace/rlinf_so101
#   OMNI_KIT_ACCEPT_EULA=YES \
#   LEISAAC_ASSETS_ROOT=/workspace/so101/leisaac_assets \
#   REPO_PATH=/workspace/rlinf_so101 \
#   PYTHONPATH=/workspace/rlinf_so101:/workspace/so101 \
#   /opt/venv/openpi/bin/python examples/embodiment/train_embodied_agent.py \
#     --config-path /workspace/rlinf_so101/tests/e2e_tests/embodied \
#     --config-name isaaclab_so101_ppo_openpi_pi05
#
# Launch (leg 2, prove the checkpoint reloads). max_epochs must be raised:
# init_workers() parses global_step=1 out of the resume dir name, so with
# max_epochs=1 the loop range(1, 1) is empty and nothing would be exercised.
# save_interval=-1 keeps leg 2 from writing a second multi-GB checkpoint.
#
#   ... same env ... \
#     runner.resume_dir=/workspace/results/isaaclab_so101_ppo_openpi_pi05/f41-e2e/checkpoints/global_step_1 \
#     runner.max_epochs=2 runner.save_interval=-1
#
# tests/e2e_tests/embodied/run.sh is deliberately NOT used: it forces
# MUJOCO_GL/PYOPENGL_PLATFORM and a placeholder ISAAC_PATH, and it does not put
# /workspace/so101 (the so101_rl extension that registers the task id) on
# PYTHONPATH.
defaults:
  - env/isaaclab_so101_lift_cube_wrist@env.train
  - env/isaaclab_so101_lift_cube_wrist@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: /workspace/results/isaaclab_so101_ppo_openpi_pi05
    project_name: rlinf
    experiment_name: "f41-e2e"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1
  max_steps: -1

  only_eval: False
  # Eval off: F3.7 covers the eval path standalone, and enabling it here would
  # build a second Isaac Sim instance per rank for no extra coverage.
  val_check_interval: -1
  save_interval: 1

  resume_dir: null # leg 2 sets this on the command line
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl # how to estimate kl divergence: kl or kl_penalty
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 3
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 4
    max_episode_steps: 100 # for truncation
    max_steps_per_rollout_epoch: 100
    use_fixed_reset_state_ids: True
    seed: 42

  eval:
    # Composed but never instantiated (val_check_interval < 0 => enable_eval False).
    # Kept so the file stays diffable against the real training config.
    rollout_epoch: 1
    total_num_envs: 4
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 100
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: False
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    seed: 42

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 4
  seed: 42
  enable_offload: False

  model:
    # The converted (openpi-layout) SO101 LiftCube SFT checkpoint. The LeRobot-layout
    # source would load silently as random weights -- see README design constraint 7.
    model_path: "/workspace/models/henry-pi05-sft-openpi"
    model_type: "openpi"
    action_dim: 6
    num_action_chunks: 50
    num_steps: 5
    add_value_head: True
    openpi:
      config_name: "pi05_so101_lift_cube"
      num_images_in_input: 2
      noise_level: 0.5
      joint_logprob: False
      num_steps: ${actor.model.num_steps}
      value_after_vlm: True
      value_vlm_mode: "mean_token"
      detach_critic_input: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
