# Minimal e2e smoke for the SO101 ManiSkill PPO path. Keeps the real recipe's
# structure (chunks=10, one update per epoch) and only shrinks the sizes:
# 16 envs x (20 steps / 10 chunks) x 1 epoch = 32 samples = global_batch_size.
# 32 also satisfies validate_cfg's requirement that global_batch_size divide by
# micro_batch_size * actor_world_size (8 * 4 on the 4-GPU box).
defaults:
  - env/maniskill_so101_pick_place@env.train
  - env/maniskill_so101_pick_place@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "so101_e2e"
    logger_backends: ["tensorboard"] # wandb, swanlab
  max_epochs: 1
  max_steps: -1
  only_eval: False
  val_check_interval: 1
  save_interval: 1000
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 1
    total_num_envs: 16
    auto_reset: True
    ignore_terminations: True  # [TASK] see header
    use_fixed_reset_state_ids: False
    max_episode_steps: 20
    max_steps_per_rollout_epoch: 20
  eval:
    rollout_epoch: 1
    total_num_envs: 8
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 20
    max_steps_per_rollout_epoch: 20
    use_fixed_reset_state_ids: True
    group_size: ${algorithm.group_size}
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: so101
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: "/workspace/dataset/RLinf-Pi05-SO101-ManiSkill-SFT" # SO101 PI0.5 SFT checkpoint
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # [MEM] the official 128 was tuned for 128x128 images; SO101 renders 640x480
  # (~25x the activations). Pure gradient-accumulation granularity: global_batch
  # is unchanged and the loss is scaled by 1/grad_accum, so the math is identical.
  micro_batch_size: 8
  global_batch_size: 32   # == 16 envs x (20/10 decisions) x 1 epoch = 1 update
  seed: 42
  enable_offload: False
  model:
    model_path: "/workspace/dataset/RLinf-Pi05-SO101-ManiSkill-SFT" # SO101 PI0.5 SFT checkpoint
    model_type: "openpi"
    num_action_chunks: 10  # == the SFT action_horizon; see header
    num_steps: 4           # [TASK] flow_noise pairing (ManiSkill official)
    add_value_head: True
    action_dim: 6          # SO101: 5 arm joints + gripper
    policy_setup: "so100"  # selects the joint-space branch in action_utils
    openpi:
      value_after_vlm: True
      config_name: "pi05_so101"
      num_images_in_input: 2   # front (3rd_view_camera) + wrist camera
      noise_method: "flow_noise"
      action_horizon: 10       # must match the SFT chunk size (H)
      # flow_noise reads noise_logvar_range; noise_params only feeds flow_sde.
      noise_logvar_range: [0.02, 0.04]
      noise_params: [0.16, 0.12, 200]  # unused while noise_method is flow_noise
      joint_logprob: True      # False for flow_sde, True for flow_noise
    openpi_data:
      # Must be the stats the SFT checkpoint was trained with.
      norm_stats_path: "/workspace/dataset/RLinf-Pi05-SO101-ManiSkill-SFT/norm_stats.json"

  optim:
    lr: 2.0e-6      # lowered from the official 5e-6 to pair with 1 update/epoch
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False # openpi does not support gradient checkpointing
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
