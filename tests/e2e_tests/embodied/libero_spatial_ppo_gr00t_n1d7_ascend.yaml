defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/gr00t_n1d7@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1

runner:
  task_type: embodied
  logger:
    log_path: "../results/ascend_libero_spatial_ppo_gr00t_n1d7"
    project_name: rlinf
    experiment_name: "ci-test"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1
  max_steps: -1

  # Declared so a run can resume or evaluate a saved checkpoint without editing
  # the file: runner.resume_dir=<...>/checkpoints/global_step_N, runner.ckpt_path=<...>.pt
  resume_dir: null
  ckpt_path: null

  only_eval: False
  val_check_interval: -1
  save_interval: -1

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1 # set eval_rollout_epoch > 0 when enable runner.only_eval or runner.val_check_interval > 0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean" 
  kl_beta: 0.01
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  # params for generation
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  # length argument for autoregressive sampling
  # max length means max amount of tokens to generate
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  # Override the default values in env/libero_spatial
  train:
    total_num_envs: 8
    max_episode_steps: 5
    max_steps_per_rollout_epoch: 5
    auto_reset: True
    # OSMesa renders on the CPU; render only the frame each action chunk uses.
    skip_intermediate_renders: True
    # auto_reset is true here, so resets happen as episodes end during
    # stepping. GR00T finishes 27-30 episodes per iteration at the full
    # scenario scale, and each reset settles the scene for 15 steps whose
    # frames nothing reads except the last. This is where the Ascend gain for
    # this model comes from: 1.385x on the iteration over three runs at four
    # cards, with the trajectory count and success rate matched to the baseline.
    skip_reset_renders: True
  eval:
    total_num_envs: 1
    max_episode_steps: 10
    auto_reset: True
    skip_intermediate_renders: True
    skip_reset_renders: True
    ignore_terminations: True
    max_steps_per_rollout_epoch: 10
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  # 123 GiB per card does not need the offload, and paying for it shows up in
  # two places: 1.029x on the iteration, from the actor (-14.6%) and the weight
  # sync (-38%). Peak HBM stayed under 40 GiB per card with it off.
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: /workspace/dataset/GR00T-N1.7-LIBERO/libero_spatial
    backbone_model_path: /workspace/dataset/Cosmos-Reason2-2B
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 8 # maximum : global batch size = micro batch size * actor num_processes.
  seed: 42
  enable_offload: False

  # Override the default values in model/gr00t_n1d7
  model:
    model_path: /workspace/dataset/GR00T-N1.7-LIBERO/libero_spatial
    backbone_model_path: /workspace/dataset/Cosmos-Reason2-2B
    model_type: "gr00t_n1d7"
    embodiment_tag: "libero_sim"
    add_value_head: True
    num_action_chunks: 1
    action_dim: 7
    denoising_steps: 1

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  
  fsdp_config:
    strategy: "fsdp"
    # hcom_allGather is 54.5% of the actor device time under full_shard, and the
    # device total matches the actor wall time, so those gathers do not overlap
    # with compute. The bottleneck is bandwidth rather than latency: enabling
    # forward_prefetch and backward_prefetch changed nothing measurable, and
    # no_shard changed nothing either because it moves the volume onto the
    # gradient all-reduce instead of removing it. shard_grad_op keeps the
    # gathered parameters for backward, which halves the gathers at the same
    # reduce volume: actor -15%.
    sharding_strategy: "shard_grad_op"
    use_orig_params: True
    # Left on. Turning it off measured nothing either way here, most likely
    # because the checkpointed layers are the frozen backbone, where there is
    # no recomputation to save, so it may as well keep the memory it saves.
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
