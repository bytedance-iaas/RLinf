{{/*
One Ingress per host: the platform issues a *.volceapi.com domain per host, so putting both
dashboards on one host would leave them sharing a single domain with no way to route between them.
*/}}
{{- include "rlinf.apig.validate" . -}}
{{- if .Values.apig.enabled }}
{{- if .Values.dashboard.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rlinf.apig.ingressName" . }}
  labels:
    {{- include "rlinf.labels" . | nindent 4 }}
  {{- with (include "rlinf.apig.annotations" . | trim) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ include "rlinf.apig.ingressClassName" . }}
  rules:
    - host: {{ include "rlinf.apig.host" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rlinf.fullname" . }}
                port:
                  number: {{ .Values.dashboard.port }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rlinf.apig.rayIngressName" . }}
  labels:
    {{- include "rlinf.labels" . | nindent 4 }}
  {{- with (include "rlinf.apig.annotations" . | trim) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ include "rlinf.apig.ingressClassName" . }}
  rules:
    - host: {{ include "rlinf.apig.rayHost" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rlinf.fullname" . }}
                port:
                  number: {{ .Values.rayDashboardPort }}
{{- end }}
