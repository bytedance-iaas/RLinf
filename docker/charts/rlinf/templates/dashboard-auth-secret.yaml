{{- include "rlinf.dashboard.auth.validate" . }}
{{- if and .Values.dashboard.auth.enabled (not .Values.dashboard.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rlinf.dashboard.authSecretName" . }}
  labels:
    {{- include "rlinf.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.dashboard.auth.usernameKey | quote }}: {{ .Values.dashboard.auth.username | quote }}
  {{ .Values.dashboard.auth.passwordKey | quote }}: {{ .Values.dashboard.auth.password | quote }}
{{- end }}
