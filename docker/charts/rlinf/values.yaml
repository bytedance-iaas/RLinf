# Defaults are installable-anywhere, not tuned for any one cluster: no node pin, no image tag and
# APIG off. The pod runs `rlinf`, the training shell you exec into.

# Resource names come from the RELEASE name. ⚠️ The name also determines the PVC
# (workspace-<name>-0) and the per-pod DNS (<name>-0.<name>.<ns>.svc) that Ray uses for node
# discovery, so renaming an EXISTING release strands its disk and starts on an empty one. Pick the
# release name deliberately; do not rename later.
nameOverride: ""

image:
  # Point this at whichever registry holds your build. The published images are on Docker Hub as
  # rlinf/rlinf (see docs/rst_source/start/installation.rst for the available tags); an internal
  # mirror or private registry works the same way.
  repository: rlinf/rlinf
  # REQUIRED, and deliberately empty: the chart does not track the image. Builds are tagged per
  # commit and there is no `latest`, so hardcoding one here would mean republishing the chart for
  # every build — the chart version and the image version are not the same thing.
  # Pass it at deploy time: `--set image.tag=<tag>`.
  # ⚠️ Verify the tag exists before deploying: a tag that was never built gives ImagePullBackOff.
  tag: ""
  pullPolicy: IfNotPresent

# Empty on purpose. The GPU request below is what schedules this pod, so pinning a node is never
# required — and an instance type from one cluster leaves the pod Pending forever on any other.
# Fill it only to force a specific machine or GPU model, e.g.
#   nodeSelector: { node.kubernetes.io/instance-type: <your-gpu-instance-type> }
#   nodeSelector: { kubernetes.io/hostname: <node-name> }
# ⚠️ Worth doing once a PVC exists: zonal volumes (ebs-*, gp*, pd-*) cannot follow a pod that gets
# rescheduled into another zone, so it can never attach the disk it already has.
nodeSelector: {}

# Training container resources. These are what a 4-GPU pi0.5 run actually needs — measured for
# that shape, not a universal floor. Scaling rule: ~4 cores and ~32Gi requested memory per GPU,
# limit ~4x the request to absorb LIBERO rendering and dataloader spikes. Smallest that starts at
# all (1 GPU smoke test): cpu 4 / memory 32Gi — below that the sim workers get OOM-killed.
# ⚠️ nvidia.com/gpu is non-compressible: requests and limits MUST be equal or the API server
# rejects the pod. cpu/memory may differ (cpu is compressible, you just get throttled).
resources:
  requests: { cpu: "16", memory: 128Gi, nvidia.com/gpu: "4" }
  limits:   { cpu: "60", memory: 512Gi, nvidia.com/gpu: "4" }

persistence:
  # A block storage class from your cluster. Must support ReadWriteOnce.
  storageClass: ""
  # Mounted at /workspace for code, checkpoints and logs.
  # The claim is a StatefulSet volumeClaimTemplate, which binds if-exists: the PVC name is derived
  # as workspace-<release>-<ordinal>, and an existing one is REUSED with all its data rather than
  # replaced. So a reinstall keeps checkpoints, and `helm uninstall` deliberately leaves the PVC
  # behind — delete it by hand to reclaim the disk.
  # ⚠️ volumeClaimTemplates is IMMUTABLE: changing size or storageClass on an existing release
  # makes `helm upgrade` fail. Resize by editing the PVC directly (if the storage class allows
  # online expansion) and updating this to match, or `kubectl delete sts --cascade=orphan` (keeps
  # pods and PVCs) first.
  size: 500Gi

# /dev/shm for multi-process simulation and the PyTorch DataLoader. Default: 256Gi. The 64Mi
# container default overflows ("Bus error" / "out of shared memory") and the container cannot
# remount it without CAP_SYS_ADMIN. Memory-backed, so it counts against resources.limits.memory —
# keep it well under that.
dshmSize: 256Gi

# Ray dashboard port. Default: 8265 (Ray's own default — change it only if you also pass
# `--dashboard-port` to `ray start`). Nothing listens here until you run `ray start` inside the
# pod, so its APIG route returns 503 until then. That is expected, not a broken ingress.
rayDashboardPort: 8265

env:
  # An ORDERED LIST, not a map: Helm's `range` sorts map keys, and reordering container env
  # changes the pod-template hash — which would restart the pod on upgrade for no reason.
  # Required for GPU rendering (LIBERO / MuJoCo EGL) inside the container.
  - { name: NVIDIA_DRIVER_CAPABILITIES, value: all }

# Public HTTPS entry point to the Ray dashboard through Volcengine APIG. OFF by default so a first
# install succeeds on any cluster; Ray stays reachable with `kubectl port-forward` either way.
#
# ⚠️ TURNING THIS ON PUBLISHES THE RAY DASHBOARD TO THE INTERNET WITH NO AUTHENTICATION.
#    There is no auth option for the Ray route and this chart deliberately does not invent one:
#    anyone who knows the assigned
#    *.volceapi.com address reaches it directly — no password, no allowlist, no gateway-level
#    check. And the address is not a secret: the platform issues it and lists it in the APIG
#    console. Since the Ray dashboard accepts arbitrary job submissions, that URL is remote code
#    execution on a GPU box for anyone who has it.
#    If you do not need Ray reachable from outside, leave apig.enabled=false and use
#    `kubectl port-forward`, or put the gateway behind your own access control.
apig:
  enabled: false

  # Two ways to get a gateway, matching the APIGInstance CRD's own two modes:
  #   create: false -> ADOPT an existing gateway (CRD sets spec.id). Put its instance id, from the
  #                    APIG console, in existingId, and ingressClassName MUST match the class that
  #                    gateway declares or it will never claim the Ingress.
  #   create: true  -> PROVISION a new one (CRD sets spec.name + spec.common). subnetIds is then
  #                    REQUIRED and must be in this cluster's VPC. Takes a few minutes, and bills.
  #
  # ⚠️ create=true is a TWO-STEP bootstrap, because the gateway's id does not exist until it has
  #    been provisioned, and the Ingress needs that id to bind to it. After the first install:
  #      kubectl get apiginstance <release>-apig -o jsonpath='{.status.id}'
  #    put that value in existingId (leaving create=true) and upgrade. Until you do, the Ingress
  #    gets no address and APIG lists no service or domain for the gateway.
  # ⚠️ A gateway this chart provisioned is DELETED by `helm uninstall`, taking its auto-assigned
  #    *.volceapi.com domain with it — a new one comes back under a different name. Adopt an
  #    existing gateway for anything whose URL people have bookmarked.
  create: false
  existingId: ""                  # create=false: REQUIRED, the gateway's instance id
  instanceName: ""                # create=true: gateway name (default: <release>-apig)
  subnetIds: []                   # create=true: REQUIRED

  # Gateway sizing. ALL OPTIONAL, and empty means "let the platform choose" — which is the right
  # default. Fill in only what you deliberately want to control. Recommended if you do:
  # instanceSpecCode 1c2g (IPv4), publicNetworkBillingType traffic (pay for what you use), and a
  # 200 Mbps cap — the gateway proxies UI traffic only, never training data.
  replicas: ""                    # gateway replicas — more than one is HA, and costs it
  instanceSpecCode: ""            # e.g. 1c2g
  clbSpecCode: ""                 # e.g. small_1
  publicNetworkBillingType: ""    # e.g. traffic
  publicNetworkBandwidth: ""      # Mbps, e.g. 200

  ingressName: ""                 # default: <release>-apig
  rayIngressName: ""              # default: <ingressName>-ray

  # One gateway per ingress class: pointing two releases at the same class routes them to one
  # gateway. Default is <release>-apig, which is unique as long as release names are.
  # ⚠️ create=false: this must be the class the ADOPTED gateway declares, not the default.
  ingressClassName: ""
  # Internal placeholder host, never public DNS — it is only the key APIG routes on, and each
  # distinct host is what earns its own managed *.volceapi.com domain. Must not collide with a
  # host already registered on the same gateway.
  # ⚠️ Never put the auto-assigned *.volceapi.com name here.
  host: ""                        # reserved for the RLinf Dashboard route added later
  # The Ray dashboard needs a host of its own to get its own domain.
  # ⚠️ This route is UNAUTHENTICATED — see the warning at the top of this section. It is the one
  # host here that hands a stranger a job-submission endpoint on your GPUs.
  rayHost: ""                     # default: ray.<release>.apig.local
  annotations: {}                 # binding annotations are added automatically from existingId
