{{/*
Publishes the RLinf Dashboard. The platform issues one managed *.volceapi.com domain per host, so
this host is what earns the release its own public address.
*/}}
{{- include "rlinf.apig.validate" . -}}
{{- if and .Values.apig.enabled .Values.dashboard.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rlinf.apig.ingressName" . }}
  labels:
    {{- include "rlinf.labels" . | nindent 4 }}
  {{- with (include "rlinf.apig.annotations" . | trim) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ include "rlinf.apig.ingressClassName" . }}
  rules:
    - host: {{ include "rlinf.apig.host" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rlinf.fullname" . }}
                port:
                  number: {{ .Values.dashboard.port }}
{{- end }}
