{{- include "rlinf.image.validate" . }}
{{- include "rlinf.dashboard.auth.validate" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rlinf.fullname" . }}
  labels:
    {{- include "rlinf.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "rlinf.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "rlinf.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rlinf.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # StatefulSet only allows Always; spelled out to document that when the dashboard sidecar
      # exits, kubelet restarts just that container instead of tearing down the whole pod — and
      # the training process with it.
      restartPolicy: Always
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Idles until you exec in and launch training by hand. Deliberately not configurable:
          # the image ENTRYPOINT is tini (PID 1, reaps the children `ray stop` leaves behind), and
          # anything that replaced this would have to keep tini as PID 1 to avoid piling up
          # <defunct> processes. Set `args`, never `command`.
          args: ["sleep", "infinity"]
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: dshm
              mountPath: /dev/shm
        {{- if .Values.dashboard.enabled }}
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          # The dedicated image already has rlinf-dashboard as its ENTRYPOINT; this is only CMD.
          args:
            - {{ .Values.dashboard.logsPath | quote }}
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.dashboard.port | quote }}
          ports:
            - name: dashboard
              containerPort: {{ .Values.dashboard.port }}
              protocol: TCP
          {{- if .Values.dashboard.auth.enabled }}
          env:
            - name: RLINF_DASHBOARD_AUTH_MODE
              value: basic
            - name: RLINF_DASHBOARD_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "rlinf.dashboard.authSecretName" . }}
                  key: {{ .Values.dashboard.auth.usernameKey | quote }}
            - name: RLINF_DASHBOARD_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rlinf.dashboard.authSecretName" . }}
                  key: {{ .Values.dashboard.auth.passwordKey | quote }}
          {{- end }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          {{- with .Values.dashboard.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Read-only: the dashboard only ever tails logs.
            - name: workspace
              mountPath: /workspace
              readOnly: true
          {{- if .Values.dashboard.auth.enabled }}
          # This is also an image-contract check: auth-capable images return 401
          # for the protected diagnostics endpoint. Older images return 200 and
          # must never become Ready with an ignored Secret.
          startupProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import http.client;
                  connection = http.client.HTTPConnection("127.0.0.1", {{ .Values.dashboard.port }}, timeout=1);
                  connection.request("GET", "/api/health");
                  raise SystemExit(0 if connection.getresponse().status == 401 else 1)
            periodSeconds: {{ default 2 .Values.dashboard.probes.startup.periodSeconds }}
            timeoutSeconds: {{ default 2 .Values.dashboard.probes.startup.timeoutSeconds }}
            failureThreshold: {{ default 30 .Values.dashboard.probes.startup.failureThreshold }}
          {{- else }}
          {{- with .Values.dashboard.probes.startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.dashboard.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.dashboard.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.dshmSize | quote }}
  # Binds an existing workspace-<release>-<ordinal> PVC if there is one and only creates it
  # otherwise, so checkpoints survive a reinstall. IMMUTABLE after creation: changing size or
  # storageClass fails the upgrade.
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
